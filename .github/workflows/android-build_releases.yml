name: Android CI Build

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'vratim/**'
      - '.github/workflows/android-build-release.yml'

defaults:
  run:
    working-directory: ./vratim

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Compile APK via Gradle
      run: ./gradlew assembleDebug

    - name: Rename Artifact to vratim.apk
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/vratim.apk

    - name: Publish Artifact to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: android-app/app/build/outputs/apk/debug/vratim.apk
        name: Release ${{ github.ref_name }}
        tag_name: ${{ github.ref }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}